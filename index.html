<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CDN Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="dock">
    <div class="logo"><a href="#">
        <span class="web">The</span>
        CDN
        <span class="web">Website</span>
    </a></div>
    <div class="nav">
        <a href="#">Files</a>
        <a href="#">Status</a>
        <a href="#">Docs</a>
    </div>
    <div class="auth"><a href="#">Account</a></div>
</div>

<section class="dashboard">
    <div class="welcome">
        <h2>Good morning, Luke!</h2>
        <p>What do you want to ship today?</p>
    </div>
    <div class="widget">
        <p><strong>Storage</strong></p>
        <p id="load">████████████░░░░░░░░░░░░░░░</p>
        <p id="storage-left">1GB left</p>
    </div>
    <div class="widget">
        <p><strong>Bandwidth</strong></p>
        <svg class="chart-bandwidth" viewBox="0 0 400 100">
            <path class="area"
                  d="M0 80
             L40 70 L80 75 L120 50 L160 55
             L200 30 L240 40 L280 25 L320 45
             L360 20 L400 28
             V100 H0 Z"/>
            <polyline
                    points="
        0,80
        40,70
        80,75
        120,50
        160,55
        200,30
        240,40
        280,25
        320,45
        360,20
        400,28
    "
            />
        </svg>
    </div>
    <div class="widget">
        <p><strong>Requests</strong></p>

        <svg class="chart-requests" viewBox="0 0 400 100">
            <path class="area"
                  d="M0 75
                 L40 72 L80 65 L120 70 L160 35
                 L200 62 L240 58 L280 20 L320 55
                 L360 48 L400 30
                 V100 H0 Z"/>

            <polyline
                    points="
                    0,75
                    40,72
                    80,65
                    120,70
                    160,35
                    200,62
                    240,58
                    280,20
                    320,55
                    360,48
                    400,30
                "
            />
        </svg>
    </div>
</section>
<section class="workplace">
    <div class="canvas">
        <h2>The canvas</h2>
        <p>Doing stuff with your files here👇</p>
        <canvas id="board"></canvas>
    </div>
    <div class="drive">
        <h2>Your files</h2>
    </div>
</section>
</body>
</html>
